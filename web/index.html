<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Waslasoft Restaurant - Realtime Restaurant Sales & Operations Management PWA">

  <!-- Mobile PWA Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Waslasoft Restaurant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Theme color -->
  <meta name="theme-color" content="#0F56D9">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Waslasoft Restaurant - Sales & Operations</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F4F7FC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      inset: 0;
    }
    flutter-view {
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      inset: 0 !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F4F7FC;
      color: #0F172A;
      font-family: inherit;
      z-index: 999999;
      opacity: 1;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    #loading-container.fade-out {
      opacity: 0;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(15, 86, 217, 0.16);
      margin-bottom: 18px;
      border: 1.5px solid #DBEAFE;
      background: #FFFFFF;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 800;
      color: #0F56D9;
      letter-spacing: 1.2px;
      margin: 0 0 6px 0;
    }
    .splash-subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 1.2px;
      margin: 0 0 24px 0;
      text-transform: uppercase;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #DBEAFE;
      border-top-color: #0F56D9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img src="favicon.png" class="splash-logo" alt="Waslasoft Restaurant">
    <h1 class="splash-title">WASLASOFT • وصلة سوفت</h1>
    <p class="splash-subtitle">Restaurant Analytics & Enterprise Portal</p>
    <div class="spinner"></div>
  </div>
  <script>
    // Global PWA prompt capture
    window.deferredPwaPrompt = null;
    window.isPwaInstalledState = false;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      console.log('[PWA] beforeinstallprompt captured.');
    });

    window.addEventListener('appinstalled', function () {
      window.deferredPwaPrompt = null;
      window.isPwaInstalledState = true;
      console.log('[PWA] Application was successfully installed.');
    });

    window.triggerPwaInstall = function () {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        return window.deferredPwaPrompt.userChoice.then(function (choiceResult) {
          window.deferredPwaPrompt = null;
          return choiceResult.outcome === 'accepted' ? 'accepted' : 'dismissed';
        });
      } else {
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || window.isPwaInstalledState) {
          return Promise.resolve('already_installed');
        }
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          return Promise.resolve('ios_manual');
        }
        return Promise.resolve('browser_prompt_unavailable');
      }
    };

    window.checkPwaInstallState = function () {
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || window.isPwaInstalledState) {
        return 'installed';
      }
      if (window.deferredPwaPrompt) {
        return 'ready';
      }
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        return 'ios';
      }
      return 'desktop_or_pending';
    };

    // Viewport recovery handler for mobile keyboards, flash messages & system overlays
    function recoverViewport() {
      if (window.scrollY !== 0 || window.pageYOffset !== 0 || (document.documentElement && document.documentElement.scrollTop !== 0) || (document.body && document.body.scrollTop !== 0)) {
        window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }
      window.dispatchEvent(new Event('resize'));
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        if (window.visualViewport.height >= (window.innerHeight * 0.8)) {
          recoverViewport();
        } else {
          window.dispatchEvent(new Event('resize'));
        }
      });
      window.visualViewport.addEventListener('scroll', function () {
        if (window.visualViewport.pageTop > 0 || window.scrollY > 0) {
          recoverViewport();
        }
      });
    }

    window.addEventListener('scroll', recoverViewport);
    window.addEventListener('blur', function () {
      setTimeout(recoverViewport, 150);
      setTimeout(recoverViewport, 400);
    });
    window.addEventListener('focus', function () {
      setTimeout(recoverViewport, 100);
      setTimeout(recoverViewport, 300);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(recoverViewport, 200);
    });

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader.parentNode) {
            loader.remove();
          }
        }, 380);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
